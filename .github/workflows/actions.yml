name: Test dice-rs

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  repository_dispatch:
    types: [ test-dice ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout Dice
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: open-s4c/dice
          ref: ${{ github.event.client_payload.commit }}
          path: dice
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo test
      - name: Build TSANO Interceptor
        run: |
          cmake -S dice -B dice/build
          cmake --build dice/build --target tsano
      - name: Compile Test with Sanitizer
        run:
          gcc -std=c11 -O1 -g -pthread -fsanitize=thread tests/atomic_stable.c -o tests/atomic_stable
      - name: Build Rust Crate (Manual Link)
        run: |
          cargo build
          cargo build --features dice-rs/manual-link
      - name: Link the Rust static library (`librecorder.a`) with your standalone dice library (`libdice.a`).
        run: 
          cc -shared -o librecorder.so \
            -Wl,--whole-archive target/debug/librecorder.a target/debug/libdice.a -Wl,--no-whole-archive \
            -lpthread -ldl
      - name: Run with TSANO
        run: TSANO_LIBDIR=dice/build/deps/tsano ./dice/deps/tsano/tsano LD_PRELOAD=./librecorder.so ./tests/atomic_stable
      - name: Publish results to Dice
        if: ${{ always() && github.event_name == 'repository_dispatch' }}
        uses: ./dice
        with:
          status: ${{ job.status }}
          title: 'dice-rs tests for Dice commit ${{ github.event.client_payload.commit }}'
          summary: 'See workflow run [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          commit: ${{ github.event.client_payload.commit }}
          check_id: ${{ github.event.client_payload.check_id }}
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
