name: Test dice-rs

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  repository_dispatch:
    types: [ test-dice ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout Dice
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: open-s4c/dice
          ref: ${{ github.event.client_payload.sha }}
          path: dice
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Create Downstream Test Check
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          repo: open-s4c/dice
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Test dice-rs
          conclusion: ${{ job.status }}
          status: completed
          output: |
            {"title":"See workflow run [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","summary":"dice-${{ github.event.client_payload.sha }}-${{ github.event.client_payload.attempt }}"}
