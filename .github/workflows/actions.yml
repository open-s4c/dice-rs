name: Test dice-rs

on:
  push:
  pull_request:
  repository_dispatch:
    types: [ test-dice ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout Dice
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: open-s4c/dice
          ref: ${{ github.event.client_payload.sha }}
          path: dice
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Create Downstream Test Check
        if: ${{ always() && github.event_name == 'repository_dispatch' }}
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: dice-${{ github.event.client_payload.sha }}-${{ github.event.client_payload.attempt }}
          conclusion: ${{ job.status }}
          status: completed
          output: |
            {"summary":"See workflow run [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"}
